<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Execution playbook card</title>
  <desc id="desc">A premium execution playbook showing product lens, fast shipping, and automation principles.</desc>
  <defs>
    <linearGradient id="bg" x1="78" y1="22" x2="1118" y2="298" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" />
      <stop offset="0.53" stop-color="#144B45" />
      <stop offset="1" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD7AA" stop-opacity="0.88" />
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.28" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="white" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="28" fill="url(#bg)" />
  <rect width="1200" height="320" rx="28" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="27" stroke="url(#stroke)" stroke-opacity="0.42" />

  <rect x="56" y="34" width="202" height="34" rx="17" fill="white" fill-opacity="0.12" />
  <text x="80" y="56" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">EXECUTION PLAYBOOK</text>
  <text x="56" y="108" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">How I turn raw work into premium portfolio material</text>

  <path d="M118 228H1082" stroke="white" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round" />
  <circle cx="220" cy="228" r="10" fill="#F59E0B" />
  <circle cx="600" cy="228" r="10" fill="#5EEAD4" />
  <circle cx="980" cy="228" r="10" fill="#FDBA74" />

  <g>
    <rect x="72" y="144" width="300" height="122" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="98" y="176" fill="#FCD7AA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">01 PRODUCT LENS</text>
    <text x="98" y="208" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Start with user friction, not just code.</text>
    <text x="98" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scope for the sharpest visible outcome, then design the repo and demo around that story.</text>
  </g>

  <g>
    <rect x="450" y="144" width="300" height="122" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="476" y="176" fill="#99F6E4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">02 FAST SHIPPING</text>
    <text x="476" y="208" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Prefer clear systems and visible demos.</text>
    <text x="476" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Clean structure, understandable README design, and working outputs beat noisy complexity every time.</text>
  </g>

  <g>
    <rect x="828" y="144" width="300" height="122" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="854" y="176" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.2">03 AUTOMATION MOAT</text>
    <text x="854" y="208" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Automate the parts that should not stay manual.</text>
    <text x="854" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Use workflows, OCR, bots, and repeatable release steps so the portfolio keeps improving with less friction.</text>
  </g>
</svg>