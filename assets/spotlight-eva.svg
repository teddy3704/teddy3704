<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EVA spotlight card</title>
  <desc id="desc">Feature card for EVA Chatbot OCR, an admissions-oriented chatbot and OCR automation project.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="542" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828" />
      <stop offset="0.55" stop-color="#172435" />
      <stop offset="1" stop-color="#223243" />
    </linearGradient>
    <radialGradient id="coolGlowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(446 82) rotate(140) scale(124 96)">
      <stop stop-color="#97C6D9" stop-opacity="0.18" />
      <stop offset="1" stop-color="#97C6D9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(468 230) rotate(140) scale(120 96)">
      <stop stop-color="#86C7BF" stop-opacity="0.18" />
      <stop offset="1" stop-color="#86C7BF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panelAccent" x1="414" y1="132" x2="470" y2="212" gradientUnits="userSpaceOnUse">
      <stop stop-color="#AEC8D8" />
      <stop offset="1" stop-color="#99CFC7" />
    </linearGradient>
  </defs>

  <rect width="560" height="320" rx="28" fill="url(#bg)" />
  <rect x="1" y="1" width="558" height="318" rx="27" stroke="white" stroke-opacity="0.08" />
  <circle cx="446" cy="82" r="84" fill="url(#coolGlowA)" />
  <circle cx="468" cy="230" r="74" fill="url(#coolGlowB)" />

  <rect x="34" y="28" width="146" height="30" rx="15" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.08" />
  <text x="54" y="47" fill="#D8E5EA" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">AI AUTOMATION</text>

  <text x="34" y="112" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">EVA Chatbot OCR</text>
  <text x="34" y="146" fill="#B9D6D1" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Admissions support with OCR and chatbot workflows</text>

  <text x="34" y="194" fill="#C3CDD7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">Built to reduce repetitive support work through document</text>
  <text x="34" y="216" fill="#C3CDD7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">understanding, automation, and guided information retrieval.</text>

  <rect x="34" y="252" width="82" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="55" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Python</text>

  <rect x="128" y="252" width="62" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="149" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">OCR</text>

  <rect x="202" y="252" width="92" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="224" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Chatbot</text>

  <rect x="396" y="112" width="92" height="116" rx="18" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.14" />
  <rect x="414" y="132" width="56" height="14" rx="7" fill="url(#panelAccent)" fill-opacity="0.92" />
  <rect x="414" y="156" width="38" height="8" rx="4" fill="white" fill-opacity="0.68" />
  <rect x="414" y="171" width="52" height="8" rx="4" fill="white" fill-opacity="0.3" />
  <rect x="414" y="196" width="56" height="16" rx="8" fill="#9ECFC7" fill-opacity="0.74" />
