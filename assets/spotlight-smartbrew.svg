<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SmartBrew spotlight card</title>
  <desc id="desc">Feature card for SmartBrew CEO Edition, a smart coffee monitoring and automation project.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="542" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828" />
      <stop offset="0.58" stop-color="#182535" />
      <stop offset="1" stop-color="#223141" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(432 92) rotate(142) scale(120 96)">
      <stop stop-color="#D8A36B" stop-opacity="0.22" />
      <stop offset="1" stop-color="#D8A36B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(474 224) rotate(140) scale(110 92)">
      <stop stop-color="#7EC2BA" stop-opacity="0.18" />
      <stop offset="1" stop-color="#7EC2BA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="410" y1="150" x2="495" y2="189" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8A36B" stop-opacity="0.65" />
      <stop offset="1" stop-color="#9FD0C8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <rect width="560" height="320" rx="28" fill="url(#bg)" />
  <rect x="1" y="1" width="558" height="318" rx="27" stroke="white" stroke-opacity="0.08" />
  <circle cx="432" cy="92" r="84" fill="url(#warmGlow)" />
  <circle cx="474" cy="224" r="72" fill="url(#coolGlow)" />

  <rect x="34" y="28" width="152" height="30" rx="15" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.08" />
  <text x="54" y="47" fill="#E7D9C4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">FLAGSHIP BUILD</text>

  <text x="34" y="112" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">SmartBrew</text>
  <text x="34" y="146" fill="#D9C1A0" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Product-minded IoT and automation</text>

  <text x="34" y="194" fill="#C3CDD7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">Coffee monitoring, system design, automation flows,</text>
  <text x="34" y="216" fill="#C3CDD7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">and a practical product story built around connected software.</text>

  <rect x="34" y="252" width="74" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="56" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Java</text>

  <rect x="120" y="252" width="58" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="138" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">IoT</text>

  <rect x="190" y="252" width="112" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="212" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Automation</text>

  <circle cx="430" cy="148" r="36" fill="white" fill-opacity="0.04" />
  <circle cx="430" cy="148" r="21" stroke="#E2C6A2" stroke-opacity="0.38" stroke-width="2.4" />
  <circle cx="474" cy="134" r="9" fill="#DFC097" fill-opacity="0.78" />
  <circle cx="494" cy="188" r="8" fill="#9FD0C8" fill-opacity="0.78" />
  <path d="M430 148L474 134L494 188" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" />
</svg>