<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Stack architecture card</title>
  <desc id="desc">A premium card showing frontend, backend, AI workflow, and delivery technologies used by Phan Van Tien.</desc>
  <defs>
    <linearGradient id="bg" x1="70" y1="24" x2="1120" y2="396" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" />
      <stop offset="0.5" stop-color="#123E3B" />
      <stop offset="1" stop-color="#9A3412" />
    </linearGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8D39F" stop-opacity="0.85" />
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0.24" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="white" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)" />
  <rect width="1200" height="420" rx="28" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="418" rx="27" stroke="url(#panelStroke)" stroke-opacity="0.4" />

  <rect x="56" y="34" width="196" height="34" rx="17" fill="white" fill-opacity="0.12" />
  <text x="80" y="56" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">STACK ARCHITECTURE</text>
  <text x="56" y="112" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Tools I use to move from idea to shipped product</text>
  <text x="56" y="146" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="500">A compact view of the layers behind web delivery, automation, and showcase-ready engineering.</text>

  <g>
    <rect x="56" y="184" width="518" height="94" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="86" y="216" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">FRONTEND</text>
    <text x="86" y="243" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">TypeScript / HTML / CSS / UI delivery</text>
    <text x="86" y="266" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Interfaces, dashboards, landing pages, and portfolio presentation with cleaner UX.</text>
    <rect x="392" y="206" width="74" height="28" rx="14" fill="#2563EB" fill-opacity="0.22" stroke="#93C5FD" stroke-opacity="0.5" />
    <text x="412" y="224" fill="#EFF6FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">TS</text>
    <rect x="476" y="206" width="78" height="28" rx="14" fill="#EA580C" fill-opacity="0.22" stroke="#FDBA74" stroke-opacity="0.5" />
    <text x="496" y="224" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">HTML</text>
    <rect x="430" y="242" width="96" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.18" stroke="#BAE6FD" stroke-opacity="0.5" />
    <text x="452" y="260" fill="#F0F9FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">CSS3</text>
  </g>

  <g>
    <rect x="626" y="184" width="518" height="94" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="656" y="216" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">BACKEND AND APPS</text>
    <text x="656" y="243" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">Node.js / Python / Java / C#</text>
    <text x="656" y="266" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">APIs, business logic, desktop experiments, OCR tooling, and applied engineering exercises.</text>
    <rect x="987" y="206" width="72" height="28" rx="14" fill="#16A34A" fill-opacity="0.2" stroke="#86EFAC" stroke-opacity="0.5" />
    <text x="1001" y="224" fill="#F0FDF4" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Node</text>
    <rect x="1067" y="206" width="62" height="28" rx="14" fill="#0EA5E9" fill-opacity="0.2" stroke="#BAE6FD" stroke-opacity="0.5" />
    <text x="1082" y="224" fill="#F0F9FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">API</text>
    <rect x="1003" y="242" width="86" height="28" rx="14" fill="#7C3AED" fill-opacity="0.16" stroke="#C4B5FD" stroke-opacity="0.5" />
    <text x="1025" y="260" fill="#F5F3FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Logic</text>
  </g>

  <g>
    <rect x="56" y="298" width="518" height="94" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="86" y="330" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">AI WORKFLOWS</text>
    <text x="86" y="357" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">OCR / chatbots / task automation / workflow glue</text>
    <text x="86" y="380" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Designed for repetitive work reduction, structured extraction, and practical school or product use cases.</text>
    <rect x="432" y="320" width="74" height="28" rx="14" fill="#14B8A6" fill-opacity="0.2" stroke="#99F6E4" stroke-opacity="0.5" />
    <text x="451" y="338" fill="#ECFEFF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">OCR</text>
    <rect x="515" y="320" width="110" height="28" rx="14" fill="#F97316" fill-opacity="0.2" stroke="#FDBA74" stroke-opacity="0.5" />
    <text x="537" y="338" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Chatbots</text>
  </g>

  <g>
    <rect x="626" y="298" width="518" height="94" rx="24" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="656" y="330" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.2">DELIVERY</text>
    <text x="656" y="357" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">GitHub Actions / GitHub Pages / release-ready presentation</text>
    <text x="656" y="380" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Automation, publishing, and visual polish so the work reads like shipped product, not raw coursework.</text>
    <rect x="1022" y="320" width="86" height="28" rx="14" fill="#1D4ED8" fill-opacity="0.2" stroke="#93C5FD" stroke-opacity="0.5" />
    <text x="1038" y="338" fill="#EFF6FF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">CI/CD</text>
  </g>
</svg>