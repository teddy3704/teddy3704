<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Phan Van Tien profile hero</title>
  <desc id="desc">A compact premium banner for Phan Van Tien featuring a software engineering identity and current public focus.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#081120" />
      <stop offset="0.55" stop-color="#0F172A" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(180 92) rotate(18) scale(270 170)">
      <stop stop-color="#22D3EE" stop-opacity="0.20" />
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 80) rotate(160) scale(260 170)">
      <stop stop-color="#A78BFA" stop-opacity="0.18" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panelStroke" x1="788" y1="60" x2="1130" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9" stop-opacity="0.32" />
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.18" />
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="298" rx="27" stroke="white" stroke-opacity="0.08" />
  <circle cx="180" cy="92" r="150" fill="url(#glowLeft)" />
  <circle cx="1020" cy="80" r="150" fill="url(#glowRight)" />

  <rect x="64" y="44" width="246" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="white" stroke-opacity="0.08" />
  <text x="86" y="66" fill="#C7D2FE" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">SOFTWARE ENGINEERING STUDENT</text>

  <text x="64" y="128" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="1">PHAN VAN TIEN</text>
  <text x="64" y="170" fill="#D6E3F0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Web delivery / OCR workflows / practical automation</text>
  <text x="64" y="210" fill="#9FB0C5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400">Turning coursework and experiments into cleaner, recruiter-ready engineering.</text>

  <g>
    <rect x="788" y="60" width="348" height="176" rx="24" fill="white" fill-opacity="0.04" stroke="url(#panelStroke)" />
    <text x="816" y="94" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">CURRENT PUBLIC SIGNAL</text>

    <circle cx="826" cy="126" r="6" fill="#67E8F9" />
    <text x="844" y="132" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">TypeScript web delivery</text>

    <circle cx="826" cy="164" r="6" fill="#34D399" />
    <text x="844" y="170" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Python OCR workflows</text>

    <circle cx="826" cy="202" r="6" fill="#A78BFA" />
    <text x="844" y="208" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Java architecture thinking</text>
  </g>
</svg>