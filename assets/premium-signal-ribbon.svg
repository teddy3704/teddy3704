<svg width="1200" height="228" viewBox="0 0 1200 228" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Profile signal ribbon</title>
  <desc id="desc">A calm profile ribbon highlighting location, focus, and availability for Phan Van Tien.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="18" x2="1140" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A" />
      <stop offset="0.58" stop-color="#134E4A" />
      <stop offset="1" stop-color="#C55B24" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5D0A0" stop-opacity="0.84" />
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.26" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="white" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1200" height="228" rx="28" fill="url(#bg)" />
  <rect width="1200" height="228" rx="28" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="226" rx="27" stroke="url(#stroke)" stroke-opacity="0.36" />

  <circle cx="1030" cy="58" r="74" fill="#F59E0B" fill-opacity="0.18" />
  <circle cx="916" cy="188" r="64" fill="#14B8A6" fill-opacity="0.12" />

  <rect x="56" y="34" width="170" height="34" rx="17" fill="white" fill-opacity="0.12" />
  <text x="80" y="56" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">PROFILE SIGNAL</text>

  <text x="56" y="106" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800">Clean full-stack work, AI automation, and product-minded delivery</text>
  <text x="56" y="136" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">A calmer snapshot of what I build and what I am open to next.</text>

  <g>
    <rect x="56" y="158" width="332" height="48" rx="18" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="78" y="178" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">BASE</text>
    <text x="78" y="194" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Da Lat, Vietnam / Da Lat University</text>
  </g>

  <g>
    <rect x="434" y="158" width="332" height="48" rx="18" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="456" y="178" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">FOCUS</text>
    <text x="456" y="194" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Web apps / OCR / automation / clean demos</text>
  </g>

  <g>
    <rect x="812" y="158" width="332" height="48" rx="18" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="834" y="178" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">OPEN</text>
    <text x="834" y="194" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Internships / collaboration / product work</text>
  </g>
</svg>