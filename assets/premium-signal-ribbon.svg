<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Premium profile signal ribbon</title>
  <desc id="desc">A premium signal ribbon summarizing location, availability, and contact details for Phan Van Tien.</desc>
  <defs>
    <linearGradient id="bg" x1="72" y1="18" x2="1128" y2="286" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" />
      <stop offset="0.55" stop-color="#134E4A" />
      <stop offset="1" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8D39F" stop-opacity="0.88" />
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.35" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="white" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="28" fill="url(#bg)" />
  <rect width="1200" height="300" rx="28" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="298" rx="27" stroke="url(#stroke)" stroke-opacity="0.42" />

  <circle cx="1045" cy="56" r="96" fill="#F59E0B" fill-opacity="0.22" filter="url(#glow)" />
  <circle cx="920" cy="252" r="86" fill="#14B8A6" fill-opacity="0.18" filter="url(#glow)" />

  <rect x="56" y="34" width="170" height="34" rx="17" fill="white" fill-opacity="0.12" />
  <text x="80" y="56" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.6">PROFILE SIGNAL</text>

  <text x="56" y="112" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Product-minded full-stack builder from Da Lat</text>
  <text x="56" y="148" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="500">Shipping AI automation, web delivery, and portfolio-grade execution with stronger presentation.</text>

  <g>
    <rect x="56" y="182" width="338" height="84" rx="22" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="82" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">BASE</text>
    <text x="82" y="242" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Da Lat, Vietnam</text>
    <text x="82" y="263" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Da Lat University / product-focused engineering track</text>
  </g>

  <g>
    <rect x="431" y="182" width="338" height="84" rx="22" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="457" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">OPEN FOR</text>
    <text x="457" y="242" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Internships / collaboration / product builds</text>
    <text x="457" y="263" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Best fit: AI workflows, polished demos, full-stack shipping</text>
  </g>

  <g>
    <rect x="806" y="182" width="338" height="84" rx="22" fill="white" fill-opacity="0.08" stroke="white" stroke-opacity="0.14" />
    <text x="832" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.1">REACH</text>
    <text x="832" y="242" fill="#FFF7ED" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">tienphanv.io.vn / 2212472@dlu.edu.vn</text>
    <text x="832" y="263" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">GitHub profile, live site, and showcase repos aligned</text>
  </g>
</svg>