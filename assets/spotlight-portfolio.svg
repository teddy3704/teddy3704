<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio spotlight card</title>
  <desc id="desc">Feature card for the tienphanv.io.vn personal portfolio website.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="20" x2="542" y2="302" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101828" />
      <stop offset="0.56" stop-color="#182536" />
      <stop offset="1" stop-color="#233243" />
    </linearGradient>
    <radialGradient id="warmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(454 84) rotate(140) scale(116 98)">
      <stop stop-color="#D8A36B" stop-opacity="0.2" />
      <stop offset="1" stop-color="#D8A36B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(474 230) rotate(140) scale(122 100)">
      <stop stop-color="#7FC2BA" stop-opacity="0.18" />
      <stop offset="1" stop-color="#7FC2BA" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accent" x1="410" y1="126" x2="490" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9B17B" />
      <stop offset="1" stop-color="#9CCEC7" />
    </linearGradient>
  </defs>

  <rect width="560" height="320" rx="28" fill="url(#bg)" />
  <rect x="1" y="1" width="558" height="318" rx="27" stroke="white" stroke-opacity="0.08" />
  <circle cx="454" cy="84" r="76" fill="url(#warmGlow)" />
  <circle cx="474" cy="230" r="80" fill="url(#coolGlow)" />

  <rect x="34" y="28" width="156" height="30" rx="15" fill="white" fill-opacity="0.07" stroke="white" stroke-opacity="0.08" />
  <text x="54" y="47" fill="#E8D9C3" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">PERSONAL BRAND</text>

  <text x="34" y="112" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">tienphanv.io.vn</text>
  <text x="34" y="146" fill="#BCD8D2" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Portfolio, storytelling, and product presentation</text>

  <text x="34" y="194" fill="#C3CDD7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">A custom-domain portfolio built to present projects,</text>
  <text x="34" y="216" fill="#C3CDD7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="400">experience, and technical identity with a cleaner narrative.</text>

  <rect x="34" y="252" width="68" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="54" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">HTML</text>

  <rect x="114" y="252" width="60" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="135" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CSS</text>

  <rect x="186" y="252" width="120" height="34" rx="17" fill="white" fill-opacity="0.06" stroke="#E5E7EB" stroke-opacity="0.18" />
  <text x="209" y="274" fill="#E5E7EB" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">GitHub Pages</text>

  <rect x="394" y="110" width="112" height="96" rx="18" fill="white" fill-opacity="0.04" stroke="white" stroke-opacity="0.14" />
  <rect x="410" y="126" width="80" height="12" rx="6" fill="url(#accent)" fill-opacity="0.94" />
  <rect x="410" y="152" width="58" height="8" rx="4" fill="white" fill-opacity="0.7" />
  <rect x="410" y="168" width="72" height="8" rx="4" fill="white" fill-opacity="0.32" />
  <rect x="410" y="188" width="46" height="10" rx="5" fill="#DDB88A" fill-opacity="0.78" />
