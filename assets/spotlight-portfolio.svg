<svg width="560" height="320" viewBox="0 0 560 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio spotlight card</title>
  <desc id="desc">Feature card for the tienphanv.io.vn personal portfolio website.</desc>
  <defs>
    <linearGradient id="bg" x1="24" y1="18" x2="542" y2="306" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1F2937" />
      <stop offset="0.48" stop-color="#9A3412" />
      <stop offset="1" stop-color="#164E63" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCD34D" />
      <stop offset="1" stop-color="#67E8F9" />
    </linearGradient>
  </defs>

  <rect width="560" height="320" rx="28" fill="url(#bg)" />
  <circle cx="458" cy="84" r="74" fill="#F59E0B" fill-opacity="0.16" />
  <circle cx="472" cy="232" r="78" fill="#06B6D4" fill-opacity="0.16" />

