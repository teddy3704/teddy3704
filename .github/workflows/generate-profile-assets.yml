name: Generate Profile Assets

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23F59E0B&color_dots=%23E5E7EB,%2394A3B8,%2314B8A6,%230F766E,%230B3B39
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FDBA74&color_dots=%230F172A,%23064E3B,%230F766E,%2314B8A6,%235EEAD4

      - name: Publish generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}